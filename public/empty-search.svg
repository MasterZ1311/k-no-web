<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="searchGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="searchShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="58" cy="54" r="46" fill="url(#searchGlow)"/>

  <!-- Background Abstract Document Sheets -->
  <g filter="url(#searchShadow)">
    <!-- Back Sheet (Tilted) -->
    <rect x="36" y="24" width="46" height="58" rx="5" transform="rotate(-8 59 53)" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <line x1="42" y1="36" x2="68" y2="32" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="44" y1="44" x2="64" y2="41" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Front Sheet -->
    <rect x="32" y="26" width="48" height="60" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Document placeholder lines -->
    <line x1="40" y1="38" x2="70" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="46" x2="62" y2="46" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="54" x2="68" y2="54" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="62" x2="56" y2="62" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="70" x2="64" y2="70" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass -->
  <g filter="url(#searchShadow)">
    <!-- Glass Lens -->
    <circle cx="56" cy="52" r="24" fill="url(#lensGlass)"/>
    
    <!-- Lens Rim -->
    <circle cx="56" cy="52" r="24" stroke="url(#rimGrad)" stroke-width="3"/>
    <circle cx="56" cy="52" r="22.5" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Lens Glass Reflection Glare -->
    <path d="M42 42 A 20 20 0 0 1 66 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Question Mark or Inspect Pivot in Lens Center -->
    <circle cx="56" cy="52" r="3" fill="#10b981" fill-opacity="0.8"/>

    <!-- Handle Neck -->
    <rect x="73" y="69" width="6" height="5" rx="1" transform="rotate(45 76 71.5)" fill="#64748b"/>
    <!-- Handle -->
    <rect x="76" y="73" width="7" height="28" rx="3.5" transform="rotate(45 79.5 87)" fill="url(#handleGrad)" stroke="#047857" stroke-width="1"/>
  </g>

  <!-- Sparkles -->
  <path d="M96 22 L97.5 26 L101 27.5 L97.5 29 L96 33 L94.5 29 L91 27.5 L94.5 26 Z" fill="#38bdf8" fill-opacity="0.9"/>
  <circle cx="24" cy="46" r="2" fill="#10b981" fill-opacity="0.6"/>
  <circle cx="98" cy="72" r="1.5" fill="#34d399"/>
</svg>
