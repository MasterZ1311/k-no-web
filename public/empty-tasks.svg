<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="taskGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="boardBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="checkBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="taskShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="82" r="62" fill="url(#taskGlow)"/>

  <!-- Clipboard Group -->
  <g filter="url(#taskShadow)">
    <!-- Clipboard Board -->
    <rect x="36" y="24" width="88" height="112" rx="10" fill="url(#boardBase)" stroke="#334155" stroke-width="1.5"/>

    <!-- Paper Sheet -->
    <rect x="44" y="36" width="72" height="92" rx="5" fill="url(#sheetGrad)"/>

    <!-- Clip at top -->
    <rect x="62" y="18" width="36" height="14" rx="4" fill="url(#clipGrad)" stroke="#334155" stroke-width="1.2"/>
    <rect x="71" y="22" width="18" height="5" rx="2.5" fill="#1e293b"/>

    <!-- Task Row 1 (Completed) -->
    <circle cx="56" cy="54" r="5" fill="#10b981"/>
    <path d="M53.5 54 L55.5 56 L58.5 52" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="66" y1="54" x2="104" y2="54" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Task Row 2 (Completed) -->
    <circle cx="56" cy="72" r="5" fill="#10b981"/>
    <path d="M53.5 72 L55.5 74 L58.5 70" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="66" y1="72" x2="98" y2="72" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Task Row 3 (Completed) -->
    <circle cx="56" cy="90" r="5" fill="#10b981"/>
    <path d="M53.5 90 L55.5 92 L58.5 88" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="66" y1="90" x2="102" y2="90" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Task Row 4 (Placeholder) -->
    <rect x="52" y="104" width="8" height="8" rx="2" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="66" y1="108" x2="88" y2="108" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Big Floating Celebratory Check Shield Badge -->
  <g filter="url(#taskShadow)" transform="translate(94, 92)">
    <!-- Pulse outer ring -->
    <circle cx="20" cy="20" r="20" fill="#10b981" fill-opacity="0.18"/>
    <!-- Main badge -->
    <circle cx="20" cy="20" r="16" fill="url(#checkBadge)" stroke="#ffffff" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M14 20 L18 24 L26 15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkles -->
  <path d="M30 40 L32 44 L36 46 L32 48 L30 52 L28 48 L24 46 L28 44 Z" fill="#10b981" fill-opacity="0.8"/>
  <circle cx="132" cy="46" r="2.5" fill="#38bdf8" fill-opacity="0.6"/>
  <circle cx="24" cy="116" r="2" fill="#10b981" fill-opacity="0.5"/>
</svg>
