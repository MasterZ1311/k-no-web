<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="noteGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="62" fill="url(#noteGlow)"/>

  <!-- Back tilted paper -->
  <rect x="42" y="32" width="76" height="96" rx="8" transform="rotate(-6 80 80)" fill="#64748b" fill-opacity="0.18" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Notebook Body -->
  <g filter="url(#softShadow)">
    <!-- Cover Base -->
    <rect x="36" y="28" width="88" height="104" rx="10" fill="url(#bookCover)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Spine binding line -->
    <line x1="48" y1="28" x2="48" y2="132" stroke="#475569" stroke-width="2"/>
    <circle cx="48" cy="42" r="1.5" fill="#10b981"/>
    <circle cx="48" cy="67" r="1.5" fill="#10b981"/>
    <circle cx="48" cy="92" r="1.5" fill="#10b981"/>
    <circle cx="48" cy="117" r="1.5" fill="#10b981"/>

    <!-- Inner page area -->
    <rect x="54" y="36" width="62" height="88" rx="4" fill="url(#pageGrad)"/>
    
    <!-- Page lines -->
    <line x1="62" y1="48" x2="108" y2="48" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="58" x2="100" y2="58" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="68" x2="94" y2="68" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="78" x2="104" y2="78" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="88" x2="86" y2="88" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="98" x2="102" y2="98" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Ribbon Bookmark -->
    <path d="M88 28 L88 64 L93 59 L98 64 L98 28 Z" fill="url(#accentGrad)"/>
  </g>

  <!-- Fountain Pen -->
  <g filter="url(#softShadow)" transform="rotate(38 116 88)">
    <!-- Pen barrel -->
    <rect x="110" y="35" width="10" height="68" rx="3" fill="url(#penBody)" stroke="#475569" stroke-width="1"/>
    <!-- Pen clip -->
    <rect x="113" y="42" width="4" height="24" rx="2" fill="url(#accentGrad)"/>
    <!-- Pen band -->
    <rect x="110" y="86" width="10" height="4" fill="#94a3b8"/>
    <!-- Nib section -->
    <path d="M111 90 L115 106 L119 90 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
    <line x1="115" y1="92" x2="115" y2="103" stroke="#64748b" stroke-width="0.8"/>
    <!-- Nib tip ink dot -->
    <circle cx="115" cy="106" r="1.5" fill="#10b981"/>
  </g>

  <!-- Floating Sparkles -->
  <path d="M130 32 L132 37 L137 39 L132 41 L130 46 L128 41 L123 39 L128 37 Z" fill="#10b981" fill-opacity="0.85"/>
  <circle cx="28" cy="72" r="2.5" fill="#10b981" fill-opacity="0.6"/>
  <circle cx="138" cy="120" r="3" fill="#38bdf8" fill-opacity="0.6"/>
</svg>
